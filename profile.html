<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Pshyco Top Up</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- 👇 Cropper.js এর CSS ও JS যুক্ত করা হলো 👇 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <link href="style.css" rel="stylesheet">
    <style>
        .history-container::-webkit-scrollbar { width: 4px; }
        .history-container::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 10px; }
        
        .avatar-container { position: relative; display: inline-block; cursor: pointer; }
        .avatar-container img { width: 90px; height: 90px; border-radius: 50%; border: 4px solid #0b0f19; object-fit: cover; background-color: #1e293b; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .avatar-container .edit-badge { position: absolute; bottom: 5px; right: 0; background: #3b82f6; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; border: 2px solid #0b0f19; }
        .name-edit-icon { font-size: 13px; color: #94a3b8; cursor: pointer; margin-left: 5px; }

        /* 👇 VIP Tier Badge Design 👇 */
        .vip-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .vip-bronze { background: rgba(205, 127, 50, 0.15); color: #cd7f32; border: 1px solid rgba(205, 127, 50, 0.4); }
        .vip-silver { background: rgba(192, 192, 192, 0.15); color: #e2e8f0; border: 1px solid rgba(192, 192, 192, 0.4); }
        .vip-gold { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); box-shadow: 0 0 10px rgba(234, 179, 8, 0.2); }

        /* 👇 ক্রপ করার পপ-আপ (Modal) এর ডিজাইন 👇 */
        #crop-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 15, 25, 0.95); z-index: 100000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
        #image-container { width: 100%; max-width: 400px; max-height: 60vh; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #image-to-crop { max-width: 100%; display: block; }
        .crop-actions { display: flex; gap: 15px; margin-top: 25px; width: 100%; max-width: 400px; }
        .crop-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-cancel { background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        .btn-save { background-color: #3b82f6; color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body style="background-color: #0b0f19; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding-bottom: 30px;">

    <!-- Hidden Input for Picture Upload -->
    <input type="file" id="pic-upload" accept="image/*" style="display: none;">

    <!-- 👇 ক্রপ করার পপ-আপ সেকশন 👇 -->
    <div id="crop-modal">
        <h3 style="color: white; margin-top: 0; margin-bottom: 20px;">Crop Profile Picture</h3>
        <div id="image-container">
            <img id="image-to-crop" src="">
        </div>
        <div class="crop-actions">
            <button id="cancel-crop" class="crop-btn btn-cancel">Cancel</button>
            <button id="save-crop" class="crop-btn btn-save"><i class="fa-solid fa-check"></i> Set Picture</button>
        </div>
    </div>

    <!-- Header Section -->
    <header style="background-color: #1e293b; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 100;">
        <i class="fa-solid fa-arrow-left" onclick="window.location.href='index.html'" style="font-size: 20px; cursor: pointer; color: #e2e8f0;"></i>
        <h2 style="margin: 0; font-size: 18px; color: white;">My Profile</h2>
    </header>

    <!-- Profile Info Section -->
    <div style="padding: 30px 20px; text-align: center; background: linear-gradient(180deg, #1e293b 0%, #0b0f19 100%);">
        
        <div class="avatar-container" onclick="document.getElementById('pic-upload').click();">
            <img id="profile-img" src="https://via.placeholder.com/100/1e293b/3b82f6?text=DP" alt="Profile">
            <div class="edit-badge"><i class="fa-solid fa-camera"></i></div>
        </div>

        <!-- 👇 VIP Tier Badge Display 👇 -->
        <div id="vip-tier-box" style="margin-top: 12px;">
            <span id="vip-tier-tag" class="vip-badge vip-bronze"><i class="fa-solid fa-medal"></i> Bronze Member</span>
        </div>

        <h3 style="margin: 5px 0 5px 0; font-size: 20px; display: flex; justify-content: center; align-items: center;">
            <span id="user-name">Loading...</span> 
            <i class="fa-solid fa-pen name-edit-icon" id="edit-name-btn"></i>
        </h3>
        
        <p id="user-email" style="margin: 0 0 5px 0; font-size: 12px; color: #3b82f6; font-weight: bold;">Loading Email...</p>
        <p id="user-phone" style="margin: 0 0 5px 0; font-size: 11px; color: #94a3b8;">Phone: Loading...</p>
        <p id="user-uid" style="margin: 0; font-size: 11px; color: #64748b;">UID: Loading...</p>
        
        <p id="user-joined" style="margin: 8px 0 0 0; font-size: 11px; color: #10b981; font-weight: bold; background: rgba(16, 185, 129, 0.1); display: inline-block; padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.3);">
            <i class="fa-solid fa-calendar-days"></i> Joined: Loading...
        </p>
    </div>

    <!-- Stats Section -->
    <div style="padding: 0 20px; margin-top: -10px;">
        <div style="background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; display: flex; justify-content: space-around; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <div>
                <i class="fa-solid fa-wallet" style="color: #3b82f6; font-size: 24px; margin-bottom: 8px;"></i>
                <h4 id="profile-balance" style="margin: 0; font-size: 18px;">0৳</h4>
                <p style="margin: 2px 0 0 0; font-size: 11px; color: #94a3b8;">Current Balance</p>
            </div>
            <div style="width: 1px; background-color: #334155;"></div>
            <div>
                <i class="fa-solid fa-clipboard-check" style="color: #10b981; font-size: 24px; margin-bottom: 8px;"></i>
                <h4 id="total-orders-count" style="margin: 0; font-size: 18px;">0</h4>
                <p style="margin: 2px 0 0 0; font-size: 11px; color: #94a3b8;">Total Orders</p>
            </div>
        </div>
    </div>

    <!-- Transaction History Section -->
    <div style="padding: 25px 20px 10px 20px;">
        <h3 style="margin: 0 0 15px 0; font-size: 14px; border-bottom: 1px solid #334155; padding-bottom: 10px; color: #fff; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-clock-rotate-left" style="color: #3b82f6;"></i> Add Money History
        </h3>
        <div id="history-list" class="history-container" style="display: flex; flex-direction: column; gap: 12px; max-height: 350px; overflow-y: auto; padding-right: 5px;">
            <p style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 10px;">Loading history...</p>
        </div>
    </div>

    <!-- Action Buttons -->
    <div style="padding: 15px 20px; display: flex; flex-direction: column; gap: 15px;">
        <button onclick="window.location.href='support.html'" style="background-color: #1e293b; border: 1px solid #334155; color: white; width: 100%; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;"><i class="fa-solid fa-headset" style="color: #3b82f6;"></i> Help & Support</div>
            <i class="fa-solid fa-chevron-right" style="color: #94a3b8; font-size: 12px;"></i>
        </button>

        <button id="logout-btn" style="background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; width: 100%; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s;">
            <div style="display: flex; align-items: center; gap: 12px;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout Account</div>
        </button>
    </div>

    <!-- 👇 Firebase & Crop Logic Script 👇 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue, query, orderByChild, equalTo, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD2d_najqnMXstfTvjlR6_4kffh5axIasY",
          authDomain: "pshyco-top-up-center.firebaseapp.com",
          databaseURL: "https://pshyco-top-up-center-default-rtdb.asia-southeast1.firebasedatabase.app/",
          projectId: "pshyco-top-up-center",
          storageBucket: "pshyco-top-up-center.firebasestorage.app",
          messagingSenderId: "454109876822",
          appId: "1:454109876822:web:6141a2e77780f75051a1f7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let cropper = null; 
        let globalUser = null; 

        onAuthStateChanged(auth, (user) => {
            if (user) {
                globalUser = user;
                document.getElementById("user-uid").innerText = "UID: " + user.uid;
                
                const userRef = ref(db, 'users/' + user.uid);
                onValue(userRef, (snapshot) => {
                    if (snapshot.exists()) {
                        let data = snapshot.val();
                        
                        document.getElementById("user-name").innerText = data.name || "Unknown User";
                        document.getElementById("user-email").innerText = data.email || user.email || "No Email";
                        document.getElementById("user-phone").innerText = "Phone: " + (data.phone || "Not Found");
                        
                        if(data.profilePic) document.getElementById("profile-img").src = data.profilePic;
                        
                        if (data.balance !== undefined) { document.getElementById("profile-balance").innerText = data.balance + "৳"; } 
                        else { document.getElementById("profile-balance").innerText = "0৳"; }

                        if (data.joined) {
                            let joinDate = new Date(data.joined);
                            let formattedJoinDate = joinDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                            document.getElementById("user-joined").innerHTML = `<i class="fa-solid fa-calendar-days"></i> Joined: ${formattedJoinDate}`;
                        } else {
                            document.getElementById("user-joined").innerHTML = `<i class="fa-solid fa-calendar-days"></i> Joined: Old Account`;
                        }
                    }
                });

                // 👇 মোট অর্ডার ও খরচ হিসাব করে VIP Tier সেট করা 👇
                const userOrdersRef = query(ref(db, 'orders'), orderByChild('uid'), equalTo(user.uid));
                onValue(userOrdersRef, (snapshot) => {
                    let totalOrders = 0;
                    let totalSpent = 0;
                    
                    if (snapshot.exists()) {
                        totalOrders = snapshot.size;
                        snapshot.forEach(child => {
                            let order = child.val();
                            if(order.status === 'Completed' && order.price) {
                                totalSpent += Number(order.price);
                            }
                        });
                    }
                    
                    document.getElementById("total-orders-count").innerText = totalOrders;

                    // VIP Tiers Logic (Gold: ৳1000+ বা ১০+ অর্ডার, Silver: ৳500+ বা ৫+ অর্ডার, অন্যথায় Bronze)
                    let tierTag = document.getElementById('vip-tier-tag');
                    if (totalSpent >= 1000 || totalOrders >= 10) {
                        tierTag.className = 'vip-badge vip-gold';
                        tierTag.innerHTML = `<i class="fa-solid fa-crown"></i> Gold VIP Member`;
                    } else if (totalSpent >= 500 || totalOrders >= 5) {
                        tierTag.className = 'vip-badge vip-silver';
                        tierTag.innerHTML = `<i class="fa-solid fa-award"></i> Silver VIP Member`;
                    } else {
                        tierTag.className = 'vip-badge vip-bronze';
                        tierTag.innerHTML = `<i class="fa-solid fa-medal"></i> Bronze Member`;
                    }
                });

                document.getElementById('edit-name-btn').addEventListener('click', () => {
                    let currentName = document.getElementById('user-name').innerText;
                    let newName = prompt("আপনার নতুন নাম লিখুন:", currentName);
                    if(newName && newName.trim().length > 0) {
                        update(ref(db, 'users/' + user.uid), { name: newName.trim() })
                        .then(() => alert("নাম আপডেট করা হয়েছে!"))
                        .catch(err => alert("Error: " + err.message));
                    }
                });

                const historyRef = query(ref(db, 'add_money_requests'), orderByChild('uid'), equalTo(user.uid));
                onValue(historyRef, (snapshot) => {
                    const historyList = document.getElementById("history-list");
                    historyList.innerHTML = ''; let records = [];
                    if (snapshot.exists()) {
                        snapshot.forEach(child => { records.push(child.val()); });
                        records.reverse(); 
                        records.forEach(req => {
                            let badgeColor, badgeBg;
                            if (req.status === 'Completed') { badgeColor = '#10b981'; badgeBg = 'rgba(16, 185, 129, 0.1)'; } 
                            else if (req.status === 'Rejected') { badgeColor = '#ef4444'; badgeBg = 'rgba(239, 68, 68, 0.1)'; } 
                            else { badgeColor = '#f59e0b'; badgeBg = 'rgba(245, 158, 11, 0.1)'; } 
                            let dateStr = "Date Unknown";
                            if (req.timestamp) { let dateObj = new Date(req.timestamp); dateStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }
                            historyList.innerHTML += `
                                <div style="background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
                                    <div style="display: flex; flex-direction: column; gap: 4px;">
                                        <b style="color: white; font-size: 13px;">${req.method || 'Payment'}</b>
                                        <span style="color: #94a3b8; font-size: 10px;">TrxID: <span style="color: #cbd5e1;">${req.trxid}</span></span>
                                        <span style="color: #94a3b8; font-size: 10px;"><i class="fa-regular fa-clock"></i> ${dateStr}</span>
                                    </div>
                                    <div style="text-align: right; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;">
                                        <b style="color: #3b82f6; font-size: 16px;">৳${req.amount}</b>
                                        <span style="background-color: ${badgeBg}; color: ${badgeColor}; padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid ${badgeColor}33;">${req.status}</span>
                                    </div>
                                </div>`;
                        });
                    } else {
                        historyList.innerHTML = `<div style="text-align: center; padding: 20px; background-color: #1e293b; border-radius: 12px; border: 1px dashed #334155;"><i class="fa-solid fa-file-invoice-dollar" style="color: #475569; font-size: 24px; margin-bottom: 10px;"></i><p style="color: #94a3b8; font-size: 12px; margin: 0;">No transactions found yet!</p></div>`;
                    }
                });
            } else {
                window.location.href = "login.html";
            }
        });

        // 👇 Image Upload & Crop Logic 👇
        document.getElementById('pic-upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('image-to-crop').src = event.target.result;
                document.getElementById('crop-modal').style.display = 'flex';
                document.body.style.overflow = 'hidden'; 

                if (cropper) cropper.destroy(); 
                
                cropper = new Cropper(document.getElementById('image-to-crop'), {
                    aspectRatio: 1, 
                    viewMode: 1,
                    autoCropArea: 1,
                    background: false
                });
            };
            reader.readAsDataURL(file);
            e.target.value = ''; 
        });

        document.getElementById('cancel-crop').addEventListener('click', () => {
            document.getElementById('crop-modal').style.display = 'none';
            document.body.style.overflow = 'auto'; 
            if (cropper) cropper.destroy();
        });

        document.getElementById('save-crop').addEventListener('click', () => {
            if (!cropper || !globalUser) return;
            
            let btn = document.getElementById('save-crop');
            let originalText = btn.innerHTML;
            btn.innerHTML = 'Saving...';
            btn.disabled = true;

            const canvas = cropper.getCroppedCanvas({ width: 250, height: 250 });
            if (!canvas) return;

            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8); 
            
            update(ref(db, 'users/' + globalUser.uid), { profilePic: compressedBase64 })
            .then(() => {
                document.getElementById('crop-modal').style.display = 'none';
                document.body.style.overflow = 'auto';
                cropper.destroy();
                btn.innerHTML = originalText;
                btn.disabled = false;
            })
            .catch(err => {
                alert("Error: " + err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        });

        document.getElementById("logout-btn").addEventListener("click", () => {
            if(confirm("Are you sure you want to logout?")) {
                signOut(auth).then(() => { window.location.href = "login.html"; })
                .catch((error) => { alert("Logout failed!"); });
            }
        });
    </script>

</body>
</html>
