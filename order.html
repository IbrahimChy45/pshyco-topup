<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Pshyco Top Up Center</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <style>
        /* Order Page Specific Styles */
        body {
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 70px; 
        }

        .page-header {
            display: flex;
            align-items: center;
            padding: 20px;
            background-color: #1e293b;
            gap: 15px;
            border-bottom: 1px solid #334155;
        }

        .page-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }

        .order-container {
            padding: 20px;
        }

        /* Order Card Style */
        .order-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info h4 {
            margin: 0 0 5px 0;
            font-size: 15px;
            color: white;
        }

        .order-info p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
        }

        .order-info .price {
            color: #3b82f6;
            font-weight: bold;
            margin-top: 5px;
            display: inline-block;
        }

        .order-status {
            text-align: right;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }

        .status-pending {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-completed {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .status-cancelled {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .order-date {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
        }

        /* Empty State */
        .empty-orders {
            text-align: center;
            padding: 50px 20px;
            color: #64748b;
        }

        .empty-orders i {
            font-size: 50px;
            margin-bottom: 15px;
            color: #334155;
        }

        .empty-orders p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="page-header">
        <h2 class="page-title">My Orders</h2>
    </div>

    <!-- Order List Container -->
    <div class="order-container" id="order-list">
        <!-- Loading Animation -->
        <div style="text-align: center; padding: 50px 20px; color: #64748b;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px;"></i>
            <p style="margin-top: 10px;">Loading your orders...</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        
        <!-- Order is Active -->
        <div class="nav-item active">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Order</span>
        </div>
        
        <div class="nav-item" onclick="window.location.href='addmoney.html'">
            <i class="fa-solid fa-wallet"></i>
            <span>Add Money</span>
        </div>
        
        <div class="nav-item" onclick="window.location.href='support.html'">
            <i class="fa-solid fa-headset"></i>
            <span>Support</span>
        </div>
    </nav>

    <!-- 👇 Firebase Script for Fetching Secure Personal Orders 👇 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD2d_najqnMXstfTvjlR6_4kffh5axIasY",
          authDomain: "pshyco-top-up-center.firebaseapp.com",
          databaseURL: "https://pshyco-top-up-center-default-rtdb.asia-southeast1.firebasedatabase.app/", 
          projectId: "pshyco-top-up-center",
          storageBucket: "pshyco-top-up-center.firebasestorage.app",
          messagingSenderId: "454109876822",
          appId: "1:454109876822:web:6141a2e77780f75051a1f7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ইউজার লগইন আছে কি না চেক করে তার নিজস্ব ফোল্ডার থেকে ডাটা লোড করা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetchMyOrders(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        // ইউজারের নিজস্ব ফোল্ডার (`users/{uid}/my_orders`) থেকে অর্ডার লোড করার ফাংশন
        function fetchMyOrders(uid) {
            const orderContainer = document.getElementById('order-list');
            const myOrdersRef = ref(db, `users/${uid}/my_orders`);

            onValue(myOrdersRef, (snapshot) => {
                let userOrders = [];
                
                snapshot.forEach((childSnapshot) => {
                    userOrders.push(childSnapshot.val());
                });

                // যদি কোনো অর্ডার না থাকে
                if (userOrders.length === 0) {
                    orderContainer.innerHTML = `
                        <div class="empty-orders">
                            <i class="fa-solid fa-box-open"></i>
                            <p>You haven't placed any orders yet!</p>
                        </div>`;
                    return;
                }

                // নতুন অর্ডারগুলো সবার উপরে দেখানোর জন্য উল্টে (Reverse) দেওয়া
                userOrders.reverse();
                let htmlContent = '';

                userOrders.forEach((order) => {
                    const dateObj = new Date(order.timestamp);
                    const formattedDate = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                    
                    let statusClass = 'status-pending';
                    if(order.status === 'Completed') statusClass = 'status-completed';
                    if(order.status === 'Cancelled') statusClass = 'status-cancelled';

                    htmlContent += `
                    <div class="order-card">
                        <div class="order-info">
                            <h4>${order.packageName || 'Top Up Package'}</h4>
                            <p>Player ID: ${order.playerId || 'N/A'}</p>
                            <span class="price">৳${order.price || 0}</span>
                        </div>
                        <div class="order-status">
                            <span class="status-badge ${statusClass}">${order.status || 'Pending'}</span>
                            <div class="order-date">${formattedDate}</div>
                        </div>
                    </div>`;
                });

                orderContainer.innerHTML = htmlContent;
            });
        }
    </script>
</body>
</html>
