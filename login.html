<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login & Register - Pshyco</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; animation: pageLoad 0.4s ease-out forwards; }
        @keyframes pageLoad { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        .auth-container { background-color: #1e293b; width: 85%; max-width: 400px; padding: 30px 25px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }

        .logo-area { text-align: center; margin-bottom: 25px; }
        .logo-area img { width: 70px; height: 70px; border-radius: 18px; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .logo-area h2 { margin: 0; color: #3b82f6; font-size: 22px; font-weight: 800; letter-spacing: 1px; }
        .logo-area p { margin: 5px 0 0 0; color: #94a3b8; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }

        .tabs { display: flex; margin-bottom: 25px; background: #151b29; border-radius: 12px; overflow: hidden; border: 1px solid #2a3449; padding: 4px; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: bold; cursor: pointer; color: #94a3b8; transition: 0.3s; border-radius: 8px; }
        .tab.active { background: #3b82f6; color: white; box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3); }

        .form-section { display: none; animation: fadeIn 0.4s ease; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 15px; text-align: left; position: relative; }
        .input-group label { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 6px; margin-left: 5px; }
        .input-group input { width: 100%; background-color: #0b0f19; border: 1px solid #2a3449; color: white; padding: 14px 15px; border-radius: 12px; box-sizing: border-box; font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #3b82f6; background-color: #111827; }

        /* পাসওয়ার্ড টগল আইকনের স্টাইল */
        .toggle-password { position: absolute; right: 15px; top: 38px; cursor: pointer; color: #94a3b8; padding: 5px; transition: 0.3s; }
        .toggle-password:hover { color: #3b82f6; }

        /* Forgot Password Link */
        .forgot-pass-wrapper { text-align: right; margin-top: -5px; margin-bottom: 15px; }
        .forgot-pass-link { color: #60a5fa; font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; transition: color 0.2s; }
        .forgot-pass-link:hover { color: #93c5fd; text-decoration: underline; }

        .submit-btn { width: 100%; background-color: #3b82f6; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.3s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); text-transform: uppercase; letter-spacing: 1px; }
        .submit-btn:active { transform: scale(0.95); }
        .submit-btn:disabled { background-color: #475569; cursor: not-allowed; box-shadow: none; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Logo Area -->
        <div class="logo-area">
            <img src="ff profile pic. png.png" alt="Logo" onerror="this.src='https://via.placeholder.com/70x70/3b82f6/ffffff?text=LOGO'">
            <h2>PSHYCO</h2>
            <p>Top Up Center</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
            <div class="tab" id="tab-register" onclick="switchTab('register')">Register</div>
        </div>

        <!-- Login Form -->
        <div id="form-login" class="form-section active">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="Enter your password" style="padding-right: 40px;">
                <i class="fa-solid fa-eye toggle-password" id="toggle-login-pass"></i>
            </div>

            <!-- 👇 Forgot Password Link 👇 -->
            <div class="forgot-pass-wrapper">
                <span class="forgot-pass-link" id="btn-forgot-pass">Forgot Password?</span>
            </div>

            <button id="btn-login" class="submit-btn"><i class="fa-solid fa-right-to-bracket"></i> Login Now</button>
        </div>

        <!-- Register Form -->
        <div id="form-register" class="form-section">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your name">
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="number" id="reg-phone" placeholder="e.g. 017XXXXXXXX">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="Enter an email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="reg-pass" placeholder="Create a password (min 6 chars)" style="padding-right: 40px;">
                <i class="fa-solid fa-eye toggle-password" id="toggle-reg-pass"></i>
            </div>
            <button id="btn-register" class="submit-btn"><i class="fa-solid fa-user-plus"></i> Create Account</button>
        </div>
    </div>

    <!-- UI Tab & Password Toggle Logic -->
    <script>
        // Tab Switch Logic
        function switchTab(tab) {
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');
            document.getElementById('form-login').classList.remove('active');
            document.getElementById('form-register').classList.remove('active');

            if(tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('form-login').classList.add('active');
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('form-register').classList.add('active');
            }
        }

        // Show/Hide Password Logic
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // Event Listeners for Password Toggles
        document.getElementById('toggle-login-pass').addEventListener('click', () => togglePassword('login-pass', 'toggle-login-pass'));
        document.getElementById('toggle-reg-pass').addEventListener('click', () => togglePassword('reg-pass', 'toggle-reg-pass'));
    </script>

    <!-- 👇 Firebase Auth Logic 👇 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD2d_najqnMXstfTvjlR6_4kffh5axIasY",
          authDomain: "pshyco-top-up-center.firebaseapp.com",
          databaseURL: "https://pshyco-top-up-center-default-rtdb.asia-southeast1.firebasedatabase.app/",
          projectId: "pshyco-top-up-center",
          storageBucket: "pshyco-top-up-center.firebasestorage.app",
          messagingSenderId: "454109876822",
          appId: "1:454109876822:web:6141a2e77780f75051a1f7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) { window.location.href = "index.html"; }
        });

        // --- LOGIN LOGIC ---
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('btn-login');

            if(!email || !pass) return alert("Please enter both email and password!");

            btn.innerText = "Logging in..."; btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                alert("Login Failed: " + error.message);
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login Now'; 
                btn.disabled = false;
            }
        });

        // --- FORGOT PASSWORD LOGIC ---
        document.getElementById('btn-forgot-pass').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();

            if(!email) {
                return alert("⚠️ দয়া করে আগে Email বক্সে আপনার ইমেইলটি লিখুন, তারপর 'Forgot Password?' এ ক্লিক করুন।");
            }

            try {
                await sendPasswordResetEmail(auth, email);
                alert("✅ আপনার ইমেইলে পাসওয়ার্ড রিসেট করার লিংক পাঠানো হয়েছে!\n\nদয়া করে আপনার Gmail এর Inbox (বা Spam ফোল্ডার) চেক করে লিংকে ক্লিক করে নতুন পাসওয়ার্ড সেট করে নিন।");
            } catch (error) {
                alert("❌ এরর: " + error.message);
            }
        });

        // --- REGISTER LOGIC ---
        document.getElementById('btn-register').addEventListener('click', async () => {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const btn = document.getElementById('btn-register');

            if(!name || !phone || !email || !pass) return alert("Please fill all fields!");
            if(pass.length < 6) return alert("Password must be at least 6 characters!");

            btn.innerText = "Creating Account..."; btn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                await set(ref(db, 'users/' + user.uid), {
                    name: name,
                    email: email,
                    phone: phone,
                    balance: 0,
                    joined: Date.now()
                });

                await set(ref(db, 'add_money_requests/' + user.uid + '_init'), {
                    uid: user.uid,
                    userPhone: phone,
                    amount: 0,
                    status: 'Account Created',
                    method: 'System',
                    trxid: 'INIT'
                });

            } catch (error) {
                alert("Registration Failed: " + error.message);
                btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account'; 
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
